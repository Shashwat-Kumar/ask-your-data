[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-data"
version = "0.1.0"
description = "Plain English in, SQL + chart out. Local-first on DuckDB, with a no-key rule-based engine and pluggable LLMs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Shashwat Kumar"}]
dependencies = ["duckdb>=0.10", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
llm = ["openai>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
ask-your-data = "ask_your_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
